# create a default session on server start
new-session

# -------------
# terminal
# -------------
# tmux-256color gives italics + proper 256 colors inside tmux.
# Tc advertises truecolor to apps when the outer terminal supports it.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# nvim autoread / focus autocmds
set -g focus-events on

# For quicker esc response in neovim
set -s escape-time 10

# Set history
set -g history-limit 20000

# Start with window 0
set -g base-index 0

# use VI
set-window-option -g mode-keys vi

# mouse support (uncomment to enable)
# set -g mouse on

# -------------
# key bindings
# -------------
# Use ctrl-g instead of ctrl-b
set -g prefix C-g
unbind C-b
bind C-g send-prefix

# reload config
unbind r
bind r source-file ~/.tmux.conf \; display-message "config reloaded"

bind ^T split-window -h -l 25%

# Toggle between the last windows
unbind ^G
bind-key C-g last-window

# horizontal and vertical splits
unbind |
bind | split-window -h
unbind _
bind _ split-window

# tile all windows
unbind =
bind = select-layout tiled

# cycle through panes
unbind ^A
bind ^A select-pane -t :.+

unbind +
bind + resize-pane -Z

unbind Right
bind Right resize-pane -R 8
unbind Left
bind Left resize-pane -L 8
unbind Up
bind Up resize-pane -U 4
unbind Down
bind Down resize-pane -D 4

unbind h
bind h select-pane -L
unbind j
bind j select-pane -D
unbind k
bind k select-pane -U
unbind l
bind l select-pane -R

# -------------
# copy mode (vi)
# -------------
# Setup 'v' to begin selection as in Vim.
# pbcopy works natively since macOS 10.12 - no reattach-to-user-namespace.
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# -------------
# status line
# -------------
set -g status-justify left
set -g status-bg colour236
set -g status-fg white
set -g status-interval 4

# window status
setw -g window-status-format "#[fg=colour236]#[bg=colour7] #I #[fg=colour236]#[bg=colour15] #W "
setw -g window-status-current-format "#[fg=colour8]#[bg=white] #I #[bg=colour110]#[fg=white] #W "
setw -g window-status-style "bg=colour236,fg=blue,default"
setw -g window-status-current-style "bg=colour236,fg=white,bold"

# -------------
# Info on left (no session display)
# -------------
set -g status-left ''
set -g status-right-length 150
set -g clock-mode-style 12
# battery and pomodoro segments print nothing when unavailable
set -g status-right " #[fg=colour168] ♥ #[fg=colour110]#(~/.tmux_scripts/battery.sh)#(~/.tmux_scripts/pomo.sh) | %I:%M%p "
